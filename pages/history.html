<!doctype html>
<html lang="en">
<head>

  <title>Snap5 History</title>
  <link rel="icon" href="../icons/32.png">
  <link rel="stylesheet" href="pages.css">
</head>
<body>

    <div class="top">
      <h1>History</h1>
      <a class="btn main" href="recorder.html" style="text-decoration:none">● New recording</a>

      <button class="btn" data-tab="recordings">My recordings</button>

    <div class="empty" id="empty" hidden>No screenshots yet.</div>
  </div>
  <script src="../lib/common.js"></script>
  <script src="../lib/db.js"></script>
  <script src="../lib/export.js"></script>
